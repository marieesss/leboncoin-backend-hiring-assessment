services:
  ads-api:
    build:
      context: .
      dockerfile: ads/internal/cmd/ads-api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ads-database:5432/${POSTGRES_DB}?sslmode=disable
      IDENTITY_URL: ${IDENTITY_URL}
      IDENTITY_TIMEOUT: ${IDENTITY_TIMEOUT}
    ports:
      - "${ADS_API_PORT}:8080"
    depends_on:
      ads-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 20

  ads-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./ads/internal/cmd/ads-api/dao/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 20

  users-api:
    build:
      context: .
      dockerfile: users/internal/cmd/users-api/Dockerfile
    environment:
      HTTP_ADDR: ":8081"
    ports:
      - "${USERS_API_PORT}:8081"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8081/health"]
      interval: 2s
      timeout: 2s
      retries: 20
